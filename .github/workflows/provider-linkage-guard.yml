name: Provider direct-linkage guard

# Reusable (workflow_call) fleet primitive: fails when the caller repo's
# tracked code, config or unit files contain an unallowlisted direct linkage
# to ANY LLM provider -- an SDK client constructed at the call site, a
# provider credential env-var name, a provider hostname, or a base-URL
# override that repoints a client.
#
# Brian's 2026-08-29 ruling, verbatim: "the entire nous ergon system should
# now be running through the krepis router... we should have no other
# parallel setups, it should all funnel through the krepis router."
# Tracker: alpha-engine-config-I9263.
#
# WHY THIS REPLACES THE PER-VENDOR GUARDS. The fleet reached this point with
# `openrouter-guard.yml` (I6564, the 2026-08-03 OpenRouter ruling) and was
# about to add `anthropic-guard.yml` (the 2026-08-29 Anthropic ruling) -- a
# near-verbatim copy with the vendor name swapped. That shape costs a new
# script, a new reusable workflow, a new allowlist file and a new caller in
# every repo for EVERY vendor, so vendor N+1 is always undetected. Direct
# direct Anthropic SDK-client construction in three of crucible-research's
# eval-judge Lambda handlers passed every guard the fleet had, for exactly
# that reason. Here the vendor is DATA: `PROVIDERS` in
# scripts/provider_linkage_guard.py. Adding one is a table row, not a repo.
#
# EXCLUDED entirely: `krepis` -- the router's own repo, holding the single
# legitimate declared provider adapter (`krepis/src/krepis/llm.py`
# constructs the SDK client inside the adapter boundary; principle 8 permits
# exactly one adapter behind the router, and forbids a CALL SITE shaped
# around a vendor). krepis is not a caller of this workflow.
#
# BASELINE. Every caller needs a root `.provider-linkage-allowlist.yaml` --
# a repo with real pre-existing matches and no allowlist reds on day one,
# and a repo genuinely clean of them needs no file at all (the script treats
# a missing one as empty). Entries carry a reason and an EXPIRY; an expired
# entry fails loudly, and a stale entry (covering nothing) fails too, so an
# allowance cannot quietly widen after the thing it cleared is gone.
#
# CONSUMERS: add one workflow file, pinned per the fleet convention. The
# `caller-` concurrency-group prefix below is MANDATORY, not cosmetic:
# inside a CALLED workflow `github.workflow` resolves to the CALLER's name,
# so a caller declaring the same bare `${{ github.workflow }}-...` group
# this workflow's own top-level `concurrency:` block uses lands in the
# identical group and GitHub kills the run with zero jobs and no check --
# the defect that kept alpha-engine-config's first openrouter-guard caller
# dead for 35 runs (alpha-engine-config-I7862, I7864).
#
#   name: Provider direct-linkage guard
#   on:
#     pull_request:
#       branches: [main]
#     push:
#       branches: [main]
#     workflow_dispatch:
#   permissions:
#     contents: read
#   concurrency:
#     group: caller-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
#     cancel-in-progress: true
#   jobs:
#     guard:
#       uses: nousergon/nousergon-lib/.github/workflows/provider-linkage-guard.yml@<commit-sha>
#
# Runner (alpha-engine-config-I12850): the job follows the fleet's
# CI_RUNNER_MODE switch for PRIVATE callers and stays on ubuntu-latest for
# everyone else -- the same rule notify-ci-failure.yml adopted in
# nousergon-lib-PR517 (alpha-engine-config-I11697). It used to hardcode
# ubuntu-latest, so a CodeBuild flip left every private caller's guard job on
# the hosted allowance the flip exists to protect; measured 2026-11-02 it was
# one of the last two jobs in nous-ergon-ops that ci_runner_mode_guard counted
# as unreachable by a flip.
#   * Inside a called workflow `vars` and `github` resolve in the CALLER's
#     context, so the caller's org-level CI_RUNNER_MODE and repository decide
#     the runner; callers pass nothing.
#   * The label names the shared `nousergon-private-runner` CodeBuild project,
#     whose org webhook serves the private repos it lists. A per-repo label
#     would name a project that exists for one repo alone.
#   * `github.event.repository.private` gates the route. Public callers
#     (crucible-*, nousergon-data, this repo's own pull_request/push runs) pay
#     nothing for hosted minutes and have no CodeBuild runner, so a flip must
#     not move them. A payload without the field reads as not-private and
#     stays hosted: the unknown case fails toward the runner that always
#     exists.
#   * actions/setup-python has no amzn2023/arm64 build (alpha-engine-config
#     I7846), so on the CodeBuild lane Python comes from dnf and later steps
#     name the interpreter through $PY. On a hosted runner $PY is unset and
#     the steps run the same setup-python interpreter as before.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: provider direct-linkage guard
    runs-on: ${{ vars.CI_RUNNER_MODE == 'codebuild' && github.event.repository.private == true && format('codebuild-nousergon-private-runner-{0}-{1}', github.run_id, github.run_attempt) || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      # Under workflow_call the checkout above gets the CALLER's repo. The
      # script lives here, so fetch it separately (unpinned, matching
      # openrouter-guard.yml and action-pin-guard.yml: the consumer pins the
      # SKELETON, not the script -- a fix to the script, or a newly covered
      # vendor, should not wait on every consumer's pin bump) and leave CWD
      # at the caller's checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: nousergon/nousergon-lib
          path: _nousergon-lib-script

      # The script ref FLOATS by decision (alpha-engine-config-I9118, option
      # (c)): a fix reaches every consumer without a pin bump, and the cost --
      # a merge to nousergon-lib main re-verdicts every repo's next run with
      # nothing recording why (I9111: nousergon-lib-PR365 red
      # crucible-dashboard-PR798 108 s after an identical tree passed) -- is
      # paid down by RECORDING what ran. Every run names the nousergon-lib
      # commit and the script's sha256, so two runs that disagree on an
      # identical tree show whether the script moved between them.
      - name: Record the guard script this run executed
        env:
          SCRIPT: _nousergon-lib-script/scripts/provider_linkage_guard.py
        run: |
          set -euo pipefail
          lib_sha="$(git -C _nousergon-lib-script rev-parse HEAD)"
          script_sha256="$(sha256sum "$SCRIPT" | cut -d' ' -f1)"
          echo "::notice title=guard script provenance::nousergon-lib@${lib_sha} scripts/provider_linkage_guard.py sha256=${script_sha256}"
          {
            echo "### Guard script provenance"
            echo ""
            echo "- nousergon-lib commit: \`${lib_sha}\` (floating ref, alpha-engine-config-I9118)"
            echo "- \`scripts/provider_linkage_guard.py\` sha256: \`${script_sha256}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        if: ${{ runner.environment == 'github-hosted' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.11"

      # CodeBuild lane (self-hosted, amzn2023/arm64): setup-python has no build
      # there, so install with dnf and name the interpreter explicitly. The
      # image's bare `python` is a pyenv shim on a drifting minor and its
      # `python3` is the system 3.9, so neither is used.
      - name: Set up Python (CodeBuild runner)
        if: ${{ runner.environment != 'github-hosted' }}
        run: |
          dnf install -y -q python3.12 python3.12-pip
          python3.12 --version
          echo "PY=python3.12" >> "$GITHUB_ENV"

      - name: Install deps
        run: '"${PY:-python3}" -m pip install --quiet pyyaml'

      - name: No unallowlisted direct provider linkage
        run: '"${PY:-python3}" _nousergon-lib-script/scripts/provider_linkage_guard.py --repo . --include-dist'
