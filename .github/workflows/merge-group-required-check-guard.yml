name: Merge-group required-check guard

# Reusable (workflow_call) fleet primitive: validates that every required
# status check declared in the repo's branch-protection rulesets (or classic
# branch protection) is produced by a workflow whose on: block includes
# merge_group: {types: [checks_requested]}.
#
# Without this, the merge queue is permanently deadlocked — the required
# context never reports on merge_group events (happened three times on
# 2026-07-23: config-I3682 for gate-label-guard, then test.yml +
# version-bump-check.yml, then crucible-dashboard gate-label-guard).
#
# This guard is deliberately NOT a required check itself — a required
# check that validates required checks creates a self-referential loop.
# It runs as an advisory on every PR to main and on every push touching
# .github/workflows/. It does not block merge.
#
# Consumers: add one workflow file:
#
#   name: Merge-group required-check guard
#   on:
#     pull_request:
#       branches: [main]
#       paths: [".github/workflows/**"]
#     push:
#       branches: [main]
#       paths: [".github/workflows/**"]
#   jobs:
#     guard:
#       uses: nousergon/nousergon-lib/.github/workflows/merge-group-required-check-guard.yml@main

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  workflow_call: {}

permissions:
  contents: read

jobs:
  guard:
    name: merge-group required-check guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # When called via workflow_call from a consumer repo, the default
      # checkout above gets the CALLER's repo (github.repository inherits
      # from the caller). The validation script lives in nousergon-lib —
      # fetch it separately into a subdirectory so we can run it while
      # keeping CWD at the caller's repo (where .github/workflows/ lives).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: nousergon/nousergon-lib
          path: _nousergon-lib-script

      # The script ref FLOATS by decision (alpha-engine-config-I9118, option
      # (c)); every run records the nousergon-lib commit and script sha256 it
      # executed, so a fleet-wide verdict change after a merge here is
      # traceable to the script that moved (see openrouter-guard.yml).
      - name: Record the guard script this run executed
        env:
          SCRIPT: _nousergon-lib-script/scripts/validate_merge_group_required_checks.py
        run: |
          set -euo pipefail
          lib_sha="$(git -C _nousergon-lib-script rev-parse HEAD)"
          script_sha256="$(sha256sum "$SCRIPT" | cut -d' ' -f1)"
          echo "::notice title=guard script provenance::nousergon-lib@${lib_sha} scripts/validate_merge_group_required_checks.py sha256=${script_sha256}"
          {
            echo "### Guard script provenance"
            echo ""
            echo "- nousergon-lib commit: \`${lib_sha}\` (floating ref, alpha-engine-config-I9118)"
            echo "- \`scripts/validate_merge_group_required_checks.py\` sha256: \`${script_sha256}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.11"

      - name: Install deps (PyYAML only — gh CLI is pre-installed on ubuntu-latest)
        run: pip install pyyaml

      # No PYTHONPATH here on purpose. The script resolves its own `src/`
      # sibling (see the bootstrap block at the top of it), because setting the
      # path in THIS file only helps consumers who bump their pin — and the
      # script always comes from lib's default branch while the skeleton is
      # pinned per consumer. That skew is what broke every repo's guard within
      # minutes of the import landing. One mechanism, in the file that cannot
      # be pinned away from it.
      - name: Validate merge_group coverage of required checks
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 _nousergon-lib-script/scripts/validate_merge_group_required_checks.py
