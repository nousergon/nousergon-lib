name: Gitleaks scan (reusable)

# Fleet-wide gitleaks primitive (alpha-engine-config-I3005): full-history
# secret/sensitive-content scan for org repos, complementing GitHub's native
# secret scanning (known-provider patterns only, e.g. AWS/Anthropic/Stripe
# token shapes) with gitleaks' broader default ruleset and custom-pattern
# support. It also catches anything committed to history before push
# protection existed, which push protection itself cannot retroactively see.
#
# Findings are uploaded as SARIF to GitHub Code Scanning rather than filed
# as issues directly. This means the EXISTING config-I2528 weekly fleet
# security-alert sweep — which already enumerates code-scanning alerts
# alongside Dependabot/secret-scanning ones — picks up gitleaks findings
# automatically as a 4th alert category, with zero changes to
# security_alert_sweep.py. Reuses the existing backlog/groom/Telegram
# pipeline instead of building a parallel one.
#
# Binary is downloaded pinned-by-version and SHA256-verified rather than via
# gitleaks/gitleaks-action, which requires a paid license for GitHub
# Organization accounts (nousergon is an org) regardless of repo visibility.
#
# Baseline: repo root `.gitleaks-baseline.json`, generated once via
#   gitleaks detect --report-path .gitleaks-baseline.json
# against the repo's current history and committed, so pre-existing/accepted
# findings don't redline CI on rollout (mirrors the pre-clear-before-flip
# playbook used for the fleet's pip-audit standardization, config-I2530).
# To accept a triaged false positive later, APPEND its one record from a
# redacted report. Never regenerate the whole file, because that accepts every
# finding present at that moment unread.
#
# Baseline matching survives a squash merge (alpha-engine-config-I12293).
# gitleaks matches a baseline record on the COMMIT as well (Commit, Date,
# Author, Message and line). A record accepted at a branch commit therefore
# stopped matching once the PR was squash-merged: the squash commit re-adds
# the same line under a new SHA, often at a different line number, and main
# went red. One case was nousergon-data fa1edc12 on 2026-10-13. The detect
# step now carries a record forward by an identity that no rewrite of history
# changes: rule, file, the secret's start and end column, and its Shannon
# entropy. A redacted report keeps all of these. It works in two passes: an
# unfiltered redacted scan, then the real scan against the committed baseline
# plus every current finding that has the same identity as a committed record.
# Each carried-forward finding is listed in the step summary. A finding with
# no committed twin still fails the job. That includes a different secret in
# the same place, which shows as a different width or entropy.
#
# Consumers: a thin caller workflow (see this repo's own
# .github/workflows/gitleaks.yml for the in-repo example; other repos use
# `uses: nousergon/nousergon-lib/.github/workflows/gitleaks-scan.yml@main`
# with `secrets: inherit`), triggered on push to main and a weekly schedule.
# Edit scan behavior HERE once — callers never change.

on:
  workflow_call:
    inputs:
      force_sarif_upload:
        description: >-
          Upload SARIF to Code Scanning even on a private repo. Default false:
          Code Scanning on a private repo requires the paid Code Security
          add-on, which this org does not buy (scm-platform-policy §9). Set
          true for a private repo that does have it.
        type: boolean
        default: false
        required: false

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          # --retry-all-errors is load-bearing: plain --retry declines to retry some
          #   connection-level failures, and 56 (connection died) is one. Before this the
          #   command had no retry at all — a first-attempt drop failed the job in 190ms
          #   (alpha-engine-config-I7069).
          curl -sSL --retry 5 --retry-delay 2 --retry-all-errors --retry-max-time 120 -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks (full history, baseline-aware, SARIF)
        id: detect
        run: |
          set -euo pipefail
          BASELINE_ARGS=""
          if [ -f .gitleaks-baseline.json ]; then
            # Pass 1: unfiltered, redacted, never fails on findings. Its report
            # stays in RUNNER_TEMP and is never uploaded.
            gitleaks detect --source . --redact --exit-code 0 \
              --report-format json --report-path "$RUNNER_TEMP/gitleaks-unfiltered.json"
            # Effective baseline = committed records + current findings that
            # share a committed record's commit-independent identity. See the
            # header. Any error here fails the job closed.
            # BEGIN baseline-carry
            python3 - .gitleaks-baseline.json "$RUNNER_TEMP/gitleaks-unfiltered.json" \
              "$RUNNER_TEMP/gitleaks-effective-baseline.json" <<'PY'
          import json
          import os
          import sys

          baseline_path, report_path, out_path = sys.argv[1:4]
          KEYS = ("RuleID", "File", "StartColumn", "EndColumn", "Entropy")


          def identity(f):
              if not all(k in f for k in KEYS):
                  return None
              return tuple(f[k] for k in KEYS)


          with open(baseline_path) as fh:
              baseline = json.load(fh)
          with open(report_path) as fh:
              findings = json.load(fh) or []
          if not isinstance(baseline, list) or not isinstance(findings, list):
              sys.exit("gitleaks baseline and report must both be JSON lists of findings")

          accepted = {}
          for b in baseline:
              key = identity(b)
              if key is not None:
                  accepted.setdefault(key, []).append(b.get("Commit", "")[:12])
          already = {(identity(b), b.get("Commit"), b.get("StartLine")) for b in baseline}

          carried = [
              f for f in findings
              if identity(f) in accepted
              and (identity(f), f.get("Commit"), f.get("StartLine")) not in already
          ]
          with open(out_path, "w") as fh:
              json.dump(baseline + carried, fh)

          lines = [f"- baseline: {len(baseline)} committed record(s); "
                   f"{len(carried)} carried forward by identity"]
          for f in carried:
              lines.append(
                  f"  - `{f['File']}` `{f['RuleID']}` at `{f.get('Commit', '')[:12]}` "
                  f"line {f.get('StartLine')} (accepted at "
                  f"{', '.join('`' + c + '`' for c in accepted[identity(f)])})"
              )
          print("\n".join(lines))
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a") as fh:
                  fh.write("### gitleaks baseline\n\n" + "\n".join(lines) + "\n\n")
          PY
            # END baseline-carry
            BASELINE_ARGS="--baseline-path $RUNNER_TEMP/gitleaks-effective-baseline.json"
          fi
          # shellcheck disable=SC2086
          gitleaks detect --source . $BASELINE_ARGS \
            --report-format sarif --report-path gitleaks-results.sarif \
            --redact

      # The findings signal is the `detect` step's exit status, NOT this upload.
      # gitleaks exits non-zero on a finding, so a real leak reddens the job
      # whether or not a Code Scanning sink exists. Everything below is about
      # where the DETAIL lands, and must never be able to mask that signal.
      - name: Upload SARIF as artifact (always — sink-independent)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: gitleaks-sarif
          path: gitleaks-results.sarif
          retention-days: 30
          if-no-files-found: warn

      # Code Scanning on a PRIVATE repo requires the paid Code Security add-on
      # (declined — scm-platform-policy §9), so the upload 403s there and
      # reddened the job on every run regardless of findings. Measured
      # 2026-07-29: nousergon-security failed 3/3 this way while its scan step
      # passed every time — a permanently-red check that said nothing about
      # whether a secret existed.
      - name: Upload SARIF to Code Scanning
        id: sarif_upload
        if: always() && (inputs.force_sarif_upload || github.event.repository.private == false)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          sarif_file: gitleaks-results.sarif
          category: gitleaks

      # Transparency: the run must say which surface carries the findings, so
      # "no Code Scanning alert" is never mistaken for "no findings".
      - name: Report where findings landed
        if: always()
        env:
          UPLOAD_OUTCOME: ${{ steps.sarif_upload.outcome }}
          DETECT_OUTCOME: ${{ steps.detect.outcome }}
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          {
            echo "### gitleaks"
            echo ""
            echo "- scan: \`${DETECT_OUTCOME}\` (non-success means gitleaks found something)"
            case "${UPLOAD_OUTCOME}" in
              success)  echo "- findings detail: **Code Scanning** (category \`gitleaks\`) + run artifact" ;;
              skipped)  echo "- findings detail: **run artifact only** — Code Scanning needs the paid Code Security add-on on a private repo, which this org declines. This is expected, not a fault." ;;
              *)        echo "- findings detail: **run artifact only** — the Code Scanning upload FAILED (\`${UPLOAD_OUTCOME}\`) on a repo that should have the sink. Investigate." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

          # Two faults must not pass quietly, and neither is "gitleaks found
          # something" — that is the detect step's job.
          #   1. The upload FAILED where the sink should exist.
          #   2. The upload was SKIPPED on a public repo, where the sink is
          #      free and always present. That means the private/public
          #      detection misread, and findings silently stopped reaching
          #      Code Scanning — the exact shape of failure this step exists
          #      to make impossible.
          if [ "${UPLOAD_OUTCOME}" != "success" ] && [ "${UPLOAD_OUTCOME}" != "skipped" ]; then
            echo "::error::Code Scanning upload failed on a repo expected to have the sink"
            exit 1
          fi
          if [ "${UPLOAD_OUTCOME}" = "skipped" ] && [ "${IS_PRIVATE}" != "true" ]; then
            echo "::error::Code Scanning upload was skipped on a non-private repo — sink detection misread"
            exit 1
          fi
