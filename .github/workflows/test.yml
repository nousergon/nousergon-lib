name: Tests

# pytest matrix across declared Python versions. Required check on PRs to
# main so a lib feature can't ship before being validated against the
# floor of declared support.
#
# Origin: ROADMAP L218 — alpha-engine-lib v0.31.0 shipped a latent
# TypeError on import under Python 3.9 (Pydantic V2 evaluates field
# annotations via get_type_hints, which cannot eval PEP 604 `str | None`
# under 3.9 even when `from __future__ import annotations` is present).
# morning-signal #24 surfaced it on consumer-side CI; v0.32.0 patched it
# via conditional `eval_type_backport` dep. This workflow is the
# chokepoint that catches the next regression of the class at lib-build
# time rather than consumer-side.

permissions: {}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # The badge-publish step below writes `coverage.json` on the orphan
    # `badges` branch through the contents API. Nothing else in this job
    # writes, and the token is scoped no wider than that.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev + transitive extras
        # [dev] alone is insufficient — several test modules import
        # optional-extra deps at module load time:
        #   - tests/test_rag_rerank.py + test_rag_retrieval_hybrid.py
        #     transit `alpha_engine_lib.rag.__init__` → `db.py` → psycopg2
        #     ([rag] extra)
        #   - tests/test_transparency.py imports pandas ([arcticdb] extra)
        #   - tests/test_quant_factor_risk.py imports numpy ([quant] extra)
        #   - tests/test_quant_factor_risk_xs.py imports pandas + sklearn
        #     ([quant-xs] extra)
        #   - tests/test_quant_stats_*.py import pandas + scipy ([quant-stats] extra)
        #   - tests/test_contracts.py importorskips jsonschema ([contracts]
        #     extra) — WITHOUT it the entire contract-conformance suite
        #     (signals / predictions / outcome_record) silently SKIPS in CI
        #     (moto only pulls jsonschema under its own all/quicksight extras,
        #     not the base install) — added 2026-07-01 with the config#1483
        #     outcome_record contract so these tests actually gate.
        #   - tests/test_rag_parquet_mirror.py imports pandas + pyarrow
        #     ([rag-parquet] extra); tests/test_rag_local_ann.py additionally
        #     imports hnswlib ([rag-local-ann] extra) — config#2958.
        # sentence-transformers ([rerank] extra) and flow-doctor
        # ([flow_doctor] extra) are NOT needed — both deferred until first
        # call inside the relevant module / tests mock the model load.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,rag,rag-parquet,rag-local-ann,arcticdb,quant,quant-xs,quant-stats,contracts,github-app]" pytest-cov

      - name: Run pytest
        run: python -m pytest -q --cov --cov-report=term-missing

      # repository-baseline-policy.md §5.1 — a badge whose value is written by
      # a human is forbidden: it renders identically to a real one and becomes
      # false the moment reality moves without anyone editing a file. The
      # README badge now renders whatever this step last published, derived
      # from the same `.coverage` file the pyproject.toml gate reads.
      #
      # One leg only, pushes to main only: a matrix run on every leg would
      # race to publish, and a pull-request run measures a tree that is not
      # yet what a reader of the README is looking at.
      - name: Publish coverage badge
        if: matrix.python-version == '3.12' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish_coverage_badge.sh

  # STRICT basedpyright, pinned to the declared floor (alpha-engine-config-I12607;
  # was basic-mode pyright, config#2534). One pinned run rather than a full
  # matrix: the floor is where PEP604-class regressions actually surface (see
  # the origin note above). Blocking: nousergon-lib is the shared contract
  # surface ~10 repos import, so a type regression here propagates fleet-wide.
  #
  # The job NAME is kept as it was on purpose: it may be a required status
  # check context, and renaming it would leave a required check that never
  # reports.
  pyright:
    name: pyright (basic, py3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + extras + basedpyright + ruff
        # Same extras as the pytest job (see its install-step comment for
        # the per-extra rationale) plus [type-check] — the mypy-boto3-stepfunctions
        # stub-only package pipeline_status/read.py's TYPE_CHECKING import
        # needs to resolve SFNClient. [rerank]/[flow_doctor] stay excluded
        # (heavy torch/transformers + flow-doctor glue, deferred at runtime
        # and unresolved-import-ignored in the two call sites that touch
        # them — see rag/rerank.py). ruff is pinned to ruff.yml's version.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,rag,rag-parquet,rag-local-ann,arcticdb,quant,quant-xs,quant-stats,contracts,github-app,type-check]"
          pip install basedpyright==1.40.2 ruff==0.14.14

      # Errors recorded in `.basedpyright/baseline.json` are tolerated; any new
      # one fails. On a PR the baseline may only shrink: a count that grew for
      # any rule means the baseline was regenerated to absorb new errors.
      # Missing RETURN annotations are not a pyright rule, so ruff's ANN rules
      # run over every src file the PR adds or changes: touch a file, annotate it.
      - name: Type check (basedpyright strict, baseline may only shrink)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          basedpyright
          if ! git diff --quiet -- .basedpyright/baseline.json; then
            echo "::warning::type errors were fixed but .basedpyright/baseline.json was not shrunk; run basedpyright locally and commit the smaller baseline."
            git checkout -- .basedpyright/baseline.json
          fi
          if [ -n "${BASE_REF}" ] && git fetch --quiet --depth=1 origin "${BASE_REF}"; then
            mapfile -t changed < <(git diff --name-only --diff-filter=AMR FETCH_HEAD HEAD -- 'src/*.py')
            if [ "${#changed[@]}" -gt 0 ]; then
              ruff check --select ANN --ignore ANN401 "${changed[@]}"
            fi
            if git cat-file -e "FETCH_HEAD:.basedpyright/baseline.json" 2>/dev/null; then
              git show "FETCH_HEAD:.basedpyright/baseline.json" > /tmp/baseline-base.json
              git show "HEAD:.basedpyright/baseline.json" > /tmp/baseline-head.json 2>/dev/null \
                || echo '{"files": {}}' > /tmp/baseline-head.json
              python3 - <<'PY'
          import collections, json, sys
          def counts(path):
              files = json.load(open(path))["files"]
              return collections.Counter(e["code"] for es in files.values() for e in es)
          base, head = counts("/tmp/baseline-base.json"), counts("/tmp/baseline-head.json")
          grown = {c: (base[c], n) for c, n in head.items() if n > base[c]}
          for code, (b, n) in sorted(grown.items()):
              print(f"::error::type baseline grew for {code}: {b} -> {n}. Fix the new errors instead of re-baselining.")
          sys.exit(1 if grown else 0)
          PY
            fi
          fi

  # Alert (Telegram) ONLY on genuine post-merge breakage of the default
  # branch. PR-branch reds (mid-fix commits, cross-repo lib-tag merge-order
  # races) stay silent. Reusable workflow + transport in nousergon-lib.
  # See alpha-engine-config#1128.
  notify-main-failure:
    needs: [test, pyright, uv-lock]
    if: ${{ failure() && github.ref == 'refs/heads/main' }}
    uses: nousergon/nousergon-lib/.github/workflows/notify-ci-failure.yml@da7cd5f45eebbe94bd2524a5fa17a3db917ed961 # main
    secrets: inherit

  # Rejects any dependency extra written with an underscore. pip <23.3 does not
  # normalise `_` to `-` in a REQUESTED extra while setuptools always normalises
  # the DECLARED one, so `pkg[flow_doctor]` matches nothing against
  # `Provides-Extra: flow-doctor` — and pip reports that as a WARNING on a
  # SUCCESSFUL exit. Measured 2026-08-12: pip 23.2.1 resolves 18 packages with
  # flow-doctor absent, 23.3.2/24.0/25.0 resolve 30 with it present. Amazon
  # Linux 2023 ships pip 23.2.1, which is how it reached production
  # (alpha-engine-config-I6963).
  #
  # This is a STATIC check on purpose. Every resolve job in this fleet upgrades
  # pip before resolving, so CI runs on a pip that normalises correctly and can
  # never reproduce the production resolver. A green resolve is not evidence.
  lint-extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - name: Lint dependency extras (no underscores)
        run: python3 scripts/lint_extras.py .
      # Shrink-only guard against hard-coded account/bucket literals (plan
      # S-04, alpha-engine-config-I12492; clause ENV-NO-LITERALS). Observe
      # mode: reports new hits and stale baseline entries against
      # .hardcoded-env-refs-baseline.json and exits 0. S-16
      # (alpha-engine-config-I12504) adds `--mode enforce`. A step in this
      # existing job, not a new workflow: stdlib only, ~1s.
      - name: Hard-coded environment references (observe)
        run: python3 scripts/hardcoded_env_refs.py --repo .

  # uv.lock must match pyproject.toml (alpha-engine-config-I12753). The
  # merge-time auto-bump pushes straight to main and, until I12753, left the
  # lock's own project version behind on every release, so `uv lock --check`
  # failed on main with nothing red. scripts/autobump.py now sets that line in
  # the bump commit; this job proves it on every PR, merge group and push.
  # uv is pinned (a lock written by one uv can need rewriting by another).
  uv-lock:
    name: uv lock --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - name: Install uv (pinned)
        run: python -m pip install --quiet "uv==0.12.24"
      - name: Lockfile is current
        run: uv lock --check
