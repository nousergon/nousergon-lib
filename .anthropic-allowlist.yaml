# .anthropic-allowlist.yaml — pre-cleared direct-Anthropic-linkage matches for
# nousergon-lib (alpha-engine-config-I9263).
#
# Schema: scripts/anthropic_guard.py::load_allowlist. Every entry needs
# `path`, `pattern` (one of sdk_client / env_key / base_url / base_url_env),
# `reason`, `expires` (YYYY-MM-DD — a past date fails CI loudly), and
# optionally `tracking`.
#
# The guard's own source (scripts/anthropic_guard.py) and the tests that load
# it are not listed here: the scanner excludes them BY CONSTRUCTION
# (mirroring alpha-engine-config-I9111's `_is_scanner_source` treatment in
# openrouter_guard.py), not by allowlist entry.
schema_version: 1
entries:
  - path: .github/workflows/anthropic-guard.yml
    pattern: sdk_client
    reason: >-
      The reusable workflow's own header comment documents what the guard
      looks for. Not a call site.
    expires: "2027-08-29"
    tracking: alpha-engine-config-I9263
  - path: .github/workflows/anthropic-guard.yml
    pattern: env_key
    reason: >-
      The reusable workflow's own header comment documents what the guard
      looks for. Not a call site.
    expires: "2027-08-29"
    tracking: alpha-engine-config-I9263
  - path: .github/workflows/anthropic-guard.yml
    pattern: base_url
    reason: >-
      The reusable workflow's own header comment documents what the guard
      looks for. Not a call site.
    expires: "2027-08-29"
    tracking: alpha-engine-config-I9263
  - path: .github/workflows/anthropic-guard.yml
    pattern: base_url_env
    reason: >-
      The reusable workflow's own header comment documents what the guard
      looks for. Not a call site.
    expires: "2027-08-29"
    tracking: alpha-engine-config-I9263
  - path: src/nousergon_lib/egress/routes.v1.json
    pattern: base_url
    reason: >-
      The published egress-proxy route contract declares which upstream hosts
      the proxy will FORWARD to, api.anthropic.com among them (the laptop
      launchd shim's passthrough route), so no caller holds a direct key
      against Anthropic's endpoint — the router-managed shape the ruling asks
      for, stated as data, not a call site holding its own linkage. Generated
      from the proxy launchers by
      claude-code-config/llm-routing/publish_egress_routes.py and never
      hand-edited (mirrors the OpenRouter-upstream entry for the same file
      under .openrouter-allowlist.yaml, alpha-engine-config-I8337).
    expires: "2027-08-29"
    tracking: alpha-engine-config-I9263
  - path: tests/test_secret_scan.py
    pattern: env_key
    reason: >-
      `_CONSUMER_PINNED_SECRETS` lists `ANTHROPIC_API_KEY` as one of the
      pinned-secret names the fleet's consumer repos (crucible-predictor,
      nousergon-data) enforce their installed-package scan against. It is the
      name of a secret being asserted PINNED, not a live read of the key —
      no call site here holds or sends it.
    expires: "2027-08-29"
    tracking: alpha-engine-config-I9263
