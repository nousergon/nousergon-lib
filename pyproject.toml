[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nousergon-lib"
version = "0.124.197"
description = "Shared utilities for the Nous Ergon (Crucible) modules: preflight, logging, ArcticDB, dates, decision capture, cost telemetry, Anthropic payload chokepoint, artifact freshness, windowed artifact resolution, RAG, agent schemas, SSM secrets, Telegram + SNS alerts, EC2 spot resilience, SSM log-capture, SSM dispatcher, Step-Functions execution-state projection, S3-conditional-PUT writer locks, and bounded-backoff HTTP retry. Full surface documented in README."
readme = "README.md"
# Floor is 3.10 (alpha-engine-config-I11251/I11253/I11254/I11255/I11256).
# Every patched release of requests (2.33.0), python-dotenv (1.2.2),
# pytest (9.0.3), pyarrow (23.0.1) and msgpack (1.2.1) requires Python >=3.10,
# so a 3.9 floor kept a `python_full_version < '3.10'` fork in uv.lock that
# could only lock the vulnerable versions. Dependabot's uv security updater
# resolves every fork at once, so each update job failed
# `dependency_file_not_resolvable` (red since 2026-10-06) and the alerts
# could never close. The 3.9 consumer this floor existed for (the always-on
# micro's AL2023 python3.9 venv) was rebuilt on python3.12 by
# alpha-engine-config#6063 (nousergon-data install-daily-news.sh).
requires-python = ">=3.10"
authors = [{ name = "Brian McMahon" }]
license = { text = "AGPL-3.0-only" }
dependencies = [
    "boto3>=1.34",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    # The generic, edge-free primitives (logging, secrets, alerts, retry,
    # locks, cost telemetry, dates, AWS plumbing) were relocated to the MIT
    # ``krepis`` package in v0.66.0; ``nousergon_lib.<module>`` now
    # re-exports ``krepis.<module>`` for back-compat (see
    # tests/test_krepis_reexport.py). New code imports krepis directly.
    # alpha-engine-config-I10141: krepis PR206 fixes the NYSE trading-day
    # guard (only guarded its future edge, so pre-2025 weekdays answered True).
    # Consumer sweep: bump floor from v0.59.41 to v0.59.52 (PR206 merged).
    "krepis>=0.59.52",
    # No eval_type_backport: it existed only for Python 3.9, where Pydantic V2
    # cannot eval PEP 604 unions. requires-python >=3.10 makes its marker
    # unsatisfiable, so it was a dead declaration (alpha-engine-config-I11735).
]

[project.scripts]
llm-egress-proxy = "nousergon_lib.egress.proxy:main"
universe-scope-lint = "nousergon_lib.contracts.universe_scope_lint:main"
# Pre-merge cost gate (alpha-engine-config-I11228). Shipped as a console entry
# so every fleet repo runs the SAME grader from the library it already pins,
# rather than a reusable workflow a public repo structurally cannot call.
nousergon-cost-gate = "nousergon_lib.cost_gate.cli:main"
# Finding-surface declaration guard (alpha-engine-config-I9707). Every repo
# that declares WORKFLOW_HEALTH_SEMANTICS in a workflow runs this as a
# pull-request check, from the library version it already pins.
workflow-health-semantics = "nousergon_lib.workflow_health_semantics:main"

[project.optional-dependencies]
arcticdb = ["arcticdb>=6.11", "pandas>=2.0"]
# Quantitative portfolio analytics (nousergon_lib.quant). Only the
# factor-risk module needs numpy; the VaR/CVaR, riskstats, returns, and
# attribution modules are pure stdlib and import without this extra.
quant = ["numpy>=1.24"]
# Cross-sectional (Fama-MacBeth) factor risk model — quant.factor_risk_xs.
# Needs pandas (always) + scikit-learn (LedoitWolf/OAS shrinkage). Kept
# separate from [quant] so the numpy-only consumers (e.g. robodashboard)
# don't pull pandas+sklearn.
quant-xs = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.0"]
# Per-series L2 data-contract validation gates (nousergon_lib.series_contract
# — alpha-engine-config#2456): schema/sanity/staleness/continuity/outlier/
# calendar-monotonic checks over an OHLCV DataFrame. pandas-only (no numpy
# API used directly; pandas vendors it) — kept as its own extra rather than
# folded into [arcticdb] so a pure-validation consumer (predictor,
# backtester) doesn't have to pull the ArcticDB C++ extension transitively.
series-contract = ["pandas>=2.0"]
# Statistical evaluation utilities (nousergon_lib.quant.stats — PSR/DSR, IC,
# expectancy, BH-FDR, risk-matched benchmarks). numpy + pandas always; scipy is
# used by information_coefficient for the p-value (numpy fallback otherwise).
quant-stats = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.7"]
# Pinned to the 0.6.0 soak (exact, explicit pre-release so pip installs it).
# Carries the notify_success / notify_on / auto-issue+fix-PR-toggle features,
# the init()->from_config removal (logging.py uses the from_config shim), and
# (rc5) the three-state fix-CLI outcome so a working-as-intended "no auto-fix"
# (e.g. an EXTERNAL provider outage) is a green notification, not a red failure.
# Bump to >=0.6.0,<0.7 when 0.6.0 final ships and the soak passes.
flow_doctor = ["krepis[flow-doctor]"]  # delegate the pin to krepis (owns the flow-doctor glue)
# GitHub App installation-token minting (nousergon_lib.github_app) — RS256
# App JWTs need PyJWT with its crypto backend (config-I2785).
github_app = ["PyJWT[crypto]>=2.8"]
contracts = ["jsonschema>=4.21"]
# The gate engine (nousergon_lib.gates) validates every ladder document against
# its shipped JSON Schema before the bytes reach a store. Producer-side
# validation is not an optional degradation -- a malformed ladder reaches a
# console that renders it as state -- so the dependency is declared rather than
# guarded by a try/except that would publish unvalidated.
gates = ["jsonschema>=4.21"]
rag = [
    "psycopg2-binary>=2.9",
    "pgvector>=0.2",
    "numpy>=1.24",
]
# S3 parquet batch-tier mirror (nousergon_lib.rag.parquet_mirror, config#2958).
# Referenced by that module's own docstring and by test.yml's install step —
# added here to make the reference true (nousergon-lib-I265): it did not
# previously exist, so `pip install nousergon-lib[rag-parquet]` silently
# installed nothing extra and mirror writes failed via the module's
# best-effort except-Exception swallow (missing pyarrow -> None return,
# indistinguishable from a real mirror bug without this extra to name it).
rag-parquet = [
    "pandas>=2.0",
    "pyarrow>=14.0",
]
# In-process HNSW batch index over the parquet mirror
# (nousergon_lib.rag.local_ann, config#2958). Needs [rag-parquet]'s
# pandas/pyarrow (reads the mirror back) plus hnswlib for the index itself.
# hnswlib's pre-compiled wheel can SIGILL on some CI runners (see
# tests/test_rag_local_ann.py's subprocess-probe comment) — that's a runtime
# concern for the test suite, not a reason to leave the extra undeclared.
rag-local-ann = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "hnswlib>=0.8",
    "numpy>=1.24",
]
# Cross-encoder rerank dependency. Pulls torch + transformers + the
# ~600MB BAAI bge-reranker-v2-m3 model on first use. Kept as a
# separate extra so vector/hybrid-only consumers don't pay the install
# cost.
#
# Floor 5.6.0 + Python >=3.10 marker (alpha-engine-config-I12017, dependabot
# #48 / GHSA local-model loading bypasses trust_remote_code): every release
# below 5.6.0 is vulnerable, and 5.2.0+ require Python >=3.10, so no patched
# release exists for 3.9. On 3.9 the extra installs nothing and
# CrossEncoderReranker raises its ImportError rather than resolving to the
# vulnerable 5.1.2. No fleet consumer installs [rerank] (checked 2026-10-06).
#
# Marker raised to >=3.11 (2026-10-24): sentence-transformers pulls filelock
# (via torch + huggingface-hub), and every filelock release fixing the
# <=4.2.0 advisories (first fixed 4.2.1) requires Python >=3.11, so the 3.10
# lock fork could only hold the vulnerable 4.0.7. Dependabot's uv security
# updater resolves every fork at once, so its filelock job failed
# `security_update_not_possible` (latest resolvable 4.0.7, lowest
# non-vulnerable 4.2.1). Same shape as the 3.9 cut above: on 3.10 the extra
# installs nothing and CrossEncoderReranker raises its ImportError.
rerank = [
    "sentence-transformers>=5.6.0; python_version >= '3.11'",
]
# Parquet row-count completeness predicate (nousergon_lib.artifact_freshness
# .check_completeness, config#3086, CompletenessCheck.kind="parquet_row_count").
# Only the Parquet footer metadata is read (ParquetFile(...).metadata.num_rows
# — no column materialization), but that still needs pyarrow importable.
# Kept as its own extra so json_count_field/csv_row_count-only consumers of
# check_completeness don't pull it.
artifact-completeness-parquet = ["pyarrow>=14.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "moto>=5.0",
    "pyarrow>=14.0",
    # tests/test_coverage_scope.py parses this file; `tomllib` is 3.11+ and
    # test.yml's matrix includes 3.9/3.10, where collection fails without
    # this (alpha-engine-config-I10434).
    "tomli>=2.0; python_version < '3.11'",
]
# Stub-only package for pyright's benefit — gives pipeline_status/read.py's
# `if TYPE_CHECKING: from mypy_boto3_stepfunctions.client import SFNClient`
# a resolvable type instead of an untyped boto3 BaseClient. Not a runtime
# dependency of anything; only needed in the pyright CI job's install step.
type-check = [
    "mypy-boto3-stepfunctions>=1.43",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The fleet environment registry, a verbatim copy of nous-ergon-ops
# governance/environments.yaml (nousergon_lib.env; alpha-engine-config-I12491).
"nousergon_lib" = ["transparency_inventory.yaml", "environments.yaml", "py.typed"]
"nousergon_lib.contracts" = ["*.schema.json"]
"nousergon_lib.gates" = ["schemas/*.json"]
# The derived, prefix-only cost SSoT the gate grades against. GENERATED in
# the private repo and published by PR — see cost_gate/data/README.md.
"nousergon_lib.cost_gate" = ["data/*.yaml"]
"nousergon_lib.rag" = ["schema.sql", "migrations/*.sql"]
"nousergon_lib.egress" = ["gitleaks-egress.toml", "gitleaks-custom.toml", "routes.v1.json", "routes.schema.v1.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]
# Process-entry HTTP server (llm-egress-proxy). Unit suite does not drive
# BaseHTTPRequestHandler; omit so the 92% ratchet is not dragged by ~440
# lines that are exercised operationally / via integration, not pytest.
omit = ["src/nousergon_lib/egress/proxy.py"]

[tool.coverage.report]
# Ratchet floor (config#2530): measured 92.78% with the same [dev,rag,
# arcticdb,quant,quant-xs,quant-stats,contracts] extras test.yml's pytest job
# installs, rounded down to integer. Prevents regression; raise
# opportunistically as coverage grows.
fail_under = 92

[tool.basedpyright]
# STRICT typing gate (alpha-engine-config-I12607; replaces config#2534's
# pyright basic mode). Pinned to the 3.10 floor — the oldest supported
# version is where PEP604-class regressions actually bite (see test.yml's
# origin note), so one pinned run catches what a 3.10-3.13 matrix would.
#
# `.basedpyright/baseline.json` records the errors that existed when strict
# mode was switched on. basedpyright ignores exactly those and fails on any
# NEW error, so every new or changed line is strict from day one. The
# baseline shrinks as old errors are fixed; CI refuses a PR that grows any
# rule's count. Never regenerate it (`--writebaseline`) to get a PR green:
# fix the code, or suppress one line with `# pyright: ignore[<rule>]` and
# say why.
include = ["src/nousergon_lib"]
# tests/ excluded: this gate protects the *importable contract* ~10 repos
# consume (src/), not the test suite. Typing 1200+ test cases is a later
# ratchet.
exclude = ["**/__pycache__"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
# Strict mode does not flag an explicit `Any`; this does. A needed `Any` (an
# untyped SDK object, raw JSON) gets a line-level ignore with a reason.
reportExplicitAny = "error"
# A bare `# type: ignore` silences every rule on the line; only rule-scoped
# `# pyright: ignore[rule]` comments are honoured.
enableTypeIgnoreComments = false
reportIgnoreCommentWithoutRule = "error"
reportUnnecessaryTypeIgnoreComment = "error"
# Optional-extra imports (pandas/numpy/psycopg2/jsonschema/etc) resolve from
# the active interpreter, into which the CI job installs
# ".[dev,rag,rag-parquet,rag-local-ann,arcticdb,quant,quant-xs,quant-stats,contracts,github-app,type-check]".

[tool.ruff]
line-length = 120
# py39, deliberately one BELOW `requires-python = ">=3.10"`: ruff's
# target-version controls which syntax UP-rules may assume, and raising it
# turns on rewrites (PEP 604 unions etc.) across the tree. Raising the floor
# (alpha-engine-config-I11254) is a dependency-resolution change, kept apart
# from a repo-wide syntax rewrite; py39-safe syntax is valid on every
# supported version. Raise this as its own change.
target-version = "py39"

[tool.ruff.lint]
# Baseline mirrors the fleet's established ruff selection (metron:
# E, W, F, I, UP, B, C4) plus S (flake8-bandit) — config#2532 propagates the
# S ruleset as a SAST-lite layer for private repos where CodeQL isn't free.
select = ["E", "W", "F", "I", "UP", "B", "C4", "S"]
# E501: line length is a formatter concern, not correctness — deferred to ruff-format.
# S603 (subprocess-untrusted-input) is deliberately NOT ignored file-by-file — it is
# excluded from selection fleet-wide, following alpha-engine-config's precedent
# (config#2532, PR#2643). Verified empirically (ruff 0.14.14): S603 fires on ANY
# non-inline-literal subprocess argv, including a shutil.which()-resolved,
# None-checked absolute path assigned to a variable one line above the call (ruff has
# no data-flow analysis for this rule; see astral-sh/ruff#4045, upstream bandit B603
# docs: "even if you validate user input, this check will still report"). Selecting a
# rule that a fail-loud/no-noqa policy cannot satisfy by any code change would force a
# blanket suppression at every call site, which is worse than not selecting it. S607
# (partial-executable-path) IS selected and enforced for real — that is the rule that
# maps to an actual root-cause fix (resolve the binary to an absolute path via
# shutil.which() and fail loudly if missing), and every producer-path finding under it
# is fixed, not suppressed.
ignore = ["E501", "S603"]

[tool.ruff.lint.per-file-ignores]
# Test files: assert is the point (S101); dummy credential-shaped literals
# passed as fixture args (S106) or bound to names like GH_TOKEN/API_KEY
# (S105) are fixture noise, not real secrets; seeded random.Random(...)
# calls (S311) exercise deterministic-sampling code under test, never
# security-sensitive. Fail-loud rule (config#2532) is scoped to
# producer/writer paths — these are not those. E402 (import not at top):
# the fleet's established `pytest.importorskip("numpy")` / `pd =
# pytest.importorskip("pandas")` guard-then-import pattern (test.yml's own
# per-extra-skip convention — see that workflow's install-step comment) is
# an intentional module-level ordering, not an accidental one; the skip
# must run before the guarded import is attempted.
"tests/**" = ["S101", "S105", "S106", "S311", "E402"]
# selftest_perturbation.py is a TEST-SUPPORT module that ships in the main
# package (mirroring nousergon_lib.pytest_time_shift) so every consumer test
# suite can import one proven-correct perturbation-assertion helper rather
# than re-deriving the pattern. assert IS the point here too — it is only
# ever called from test code (alpha-engine-config-I7262) — but it lives under
# src/, not tests/, so it needs its own per-file-ignore rather than inheriting
# the tests/** one above.
"src/nousergon_lib/quant/selftest_perturbation.py" = ["S101"]
# load_allowlist's schema_version assert is a fail-loud config-shape guard
# raised at import/collection time in every consumer's own test run, not a
# security-sensitive check disabled by `python -O` in production — mirrors
# selftest_perturbation.py's rationale above (alpha-engine-config-I10226).
"src/nousergon_lib/testing/debug_swallow_guard.py" = ["S101"]
