# Every entry below is the guard's OWN implementation and test/workflow
# source, which necessarily contains these literals to detect and exercise
# them — the pattern this file exists to allowlist is the exact one the
# guard's fixtures construct on purpose. Nothing here is a real call site.
schema_version: 1
