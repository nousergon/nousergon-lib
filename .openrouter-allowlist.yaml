# .openrouter-allowlist.yaml — pre-cleared OpenRouter-literal matches for
# nousergon-lib (alpha-engine-config-I6564, epic I6367 sub-issue 10).
#
# Schema: scripts/openrouter_guard.py::load_allowlist. Every entry needs
# `path`, `pattern` (one of base_url / env_key / provider_literal), `reason`,
# `expires` (YYYY-MM-DD — a past date fails CI loudly), and optionally
# `tracking`.
#
# The guard's own source (scripts/openrouter_guard.py) and the tests that
# load it are no longer listed here: the scanner excludes them BY
# CONSTRUCTION (alpha-engine-config-I9111, openrouter_guard.py::
# _is_scanner_source). One allowlist entry per pattern class per guard file,
# growing by two every time a pattern is added, was maintenance this file
# should never have carried. What remains is the reusable workflow's own
# header prose and the published egress route contract — neither is a call
# site.
schema_version: 1
entries:
  - path: .github/workflows/openrouter-guard.yml
    pattern: base_url
    reason: >-
      The reusable workflow's own header comment documents what the guard
      looks for. Not a call site.
    expires: "2027-08-19"
    tracking: alpha-engine-config-I6564
  - path: .github/workflows/openrouter-guard.yml
    pattern: env_key
    reason: >-
      The reusable workflow's own header comment documents what the guard
      looks for. Not a call site.
    expires: "2027-08-19"
    tracking: alpha-engine-config-I6564
  - path: .github/workflows/openrouter-guard.yml
    pattern: provider_literal
    reason: >-
      The reusable workflow's own header comment documents what the guard
      looks for. Not a call site.
    expires: "2027-08-19"
    tracking: alpha-engine-config-I6564
  - path: src/nousergon_lib/egress/routes.v1.json
    pattern: base_url
    reason: >-
      The published egress-proxy route contract declares which upstream hosts
      the proxy will FORWARD to, openrouter.ai among them, as a keyed route —
      the proxy substitutes the fleet's single credential, so no caller holds
      one. That is the router-managed shape the epic ruling asks for, stated
      as data; it is the opposite of a call site holding its own key. The file
      is generated from the proxy launchers by
      claude-code-config/llm-routing/publish_egress_routes.py and is never
      hand-edited (alpha-engine-config-I8337).
    expires: "2027-08-25"
    tracking: alpha-engine-config-I8337
