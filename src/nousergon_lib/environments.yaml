# Fleet environment registry (ENV-REGISTRY; plan S-03, alpha-engine-config-I12491).
#
# SOURCE OF TRUTH: nous-ergon-ops governance/environments.yaml. nousergon-lib
# ships a VERBATIM copy as package data (src/nousergon_lib/environments.yaml);
# ops CI fails when the two differ after parsing
# (`python -m nousergon_lib.env parity governance/environments.yaml`).
# Change the governance file first, then copy it to the library in a PR.
#
# The copy is PUBLIC (nousergon-lib is a public PyPI package). Put nothing here
# that fails the publication test: no credentials, no secret values. SSM entries
# are parameter-name PREFIXES, never values.
#
# Read ONLY through `nousergon_lib.env` (ENV-NO-LITERALS): code asks for a role
# (`env.resolve().bucket("research")`), never for a literal. The environment is
# one setting, NE_ENV (default `default:` below). Unknown keys anywhere fail
# the schema; an unknown role or environment raises at resolve time.
#
# prod is the default and the only environment any consumer resolves today.
# staging (S-03 second slice) is DECLARED ahead of the account (S-06,
# alpha-engine-config-I12494) and stack (S-17, I12505) that make it real:
# nothing reads it until a consumer is switched with NE_ENV=staging, so adding
# it changes no behaviour. Prod data is read-only from staging; staging writes
# only its own stores (ENV-PROD-OWNS-DATA).
# Times are America/New_York wall-clock (DST ends 2026-11-01).

schema_version: 1
default: prod

environments:
  prod:
    account: "711398986525"
    region: us-east-1

    # Role -> bucket name.
    buckets:
      research: alpha-engine-research            # data of record: ArcticDB, corpus, market data
      crucible: alpha-engine-crucible-v2         # crucible v2 store (stack parameter BucketName)
      cloudtrail_archive: nousergon-fleet-cloudtrail-archive

    # Role -> {bucket role, key prefix}; `env.s3_uri(role)`.
    stores:
      crucible: {bucket: crucible, prefix: crucible}     # CRUCIBLE_STORE
      arcticdb: {bucket: research, prefix: arcticdb}     # CRUCIBLE_ARCTIC_BUCKET's library root

    # Role -> CloudFormation stack name.
    stacks:
      crucible: crucible-v2
      orchestration: alpha-engine-orchestration
      data_collection: nousergon-data-collection
      cloudtrail: fleet-cloudtrail

    # Postgres state (plan section 5). null = not provisioned yet (S-10, I12498).
    state_store:
      neon_branch: null

    # Role -> SNS topic NAME; `env.topic_arn(role)` builds the ARN.
    topics:
      pages: crucible-v2-pages
      pages_muted: crucible-v2-pages-muted
      alerts: alpha-engine-alerts
      alerts_muted: alpha-engine-alerts-muted
      alarm_backstop: alpha-engine-alarm-backstop
      watchdog: alpha-engine-watchdog-alerts

    # Role -> fixed EC2 instance. Crucible v2 boxes are spot and ephemeral, so
    # they are not listed. Matches governance/box-config-deploy-targets.json.
    instances:
      dashboard: i-09b539c844515d549
      trading: i-018eb3307a21329bf

    # Role -> SSM parameter-name prefix (names only, never values).
    ssm_prefixes:
      alpha_engine: /alpha-engine/
      crucible: /crucible-v2/
      llm: /nous-ergon/
      krepis: /krepis/

    # Per-weekly-run LLM spend ceiling, USD (crucible.llm.DEFAULT_LLM_CAP_USD).
    llm_cap_usd: 5.0

    # Order routes the trader may enable (crucible-trader
    # CRUCIBLE_TRADER_ORDER_ROUTING values; alpha-engine-config-I12685). prod
    # routes to IB PAPER only; the router itself refuses anything else.
    trader:
      routing_allowed: [ib_paper]

    # The declared universe (CRUCIBLE_UNIVERSE_URI). full = every declared name.
    universe:
      scope: full
      bucket: research
      key: market_data/latest_weekly.json

    # Crucible v2 EventBridge Scheduler cadences (crucible-v2 stack,
    # ScheduleExpressionTimezone America/New_York).
    schedules_et:
      data_daily: {days: MON-FRI, time_et: "21:15"}
      serve_daily_m: {days: MON-FRI, time_et: "22:15"}
      serve_daily_u: {days: MON-FRI, time_et: "22:15"}
      serve_daily_s: {days: MON-FRI, time_et: "22:30"}
      weekly: {days: SAT, time_et: "07:00"}
      alerts_sweep: {days: DAILY, time_et: "21:00"}
      heartbeat: {days: SAT, time_et: "17:00"}

  # Staging (epic alpha-engine-config-I12488; plan section 3 "What runs in
  # staging"). Same role names as prod, so code resolves the same role in
  # either environment. A role prod has and staging lacks is deliberate: asking
  # for it in staging raises rather than silently reaching a prod resource.
  staging:
    account: "041443079404"
    region: us-east-1

    buckets:
      research: alpha-engine-research            # PROD data of record, READ-ONLY cross-account (S-08, I12496)
      crucible: alpha-engine-crucible-v2-staging # staging's own crucible store: the only bucket staging writes

    stores:
      crucible: {bucket: crucible, prefix: crucible}     # CRUCIBLE_STORE (staging bucket)
      arcticdb: {bucket: research, prefix: arcticdb}     # the prod library, read-only

    # Same template (crucible-v2.yaml) in the staging account (S-17, I12505).
    # data_collection: the weekly/collection half only (S-18, I12506; row added
    # by I12646). `orchestration` is deliberately NOT declared: it carries fixed
    # prod boxes and v1 Lambda ARNs, so asking staging for it must raise.
    stacks:
      crucible: crucible-v2
      data_collection: nousergon-data-collection

    # Neon staging branch: not provisioned yet (S-10, I12498).
    state_store:
      neon_branch: null

    # Muted pages: every page role resolves to the stack's zero-subscriber
    # PagesMutedTopic, so nothing in staging can page (plan: "Alerts: no
    # pages"; a staging-gate page on promotion day is S-20's, not this file's).
    # alerts (I12646) is the same muted topic, so the data_collection stack's
    # AlertsTopicName derives to a topic whose only subscriber is the S-20
    # digest sink. No `alerts_muted` role: the muted topic is the only one.
    topics:
      pages: crucible-v2-pages-muted
      pages_muted: crucible-v2-pages-muted
      alerts: crucible-v2-pages-muted

    # No fixed boxes: staging runs on spot and never on a prod instance.
    instances: {}

    ssm_prefixes:
      crucible: /crucible-v2/
      llm: /nous-ergon/

    # Low per-run LLM ceiling (CRUCIBLE_LLM_CAP_USD), with a cheap model or
    # recorded replies (S-17).
    llm_cap_usd: 0.5

    # Staging never routes (S-19, alpha-engine-config-I12507 / -I12685): its
    # trader is shadow, or simulated fills at the close with no broker reached.
    trader:
      routing_allowed: []

    # The fixed adversarial ~100-name subset (splits, restatements, delistings,
    # symbol changes). A declared list in staging's own bucket, written by S-17.
    universe:
      scope: subset
      bucket: crucible
      key: universe/staging_subset.json

    # Light runs, offset AFTER the prod chain so they read that day's prod data
    # and never compete with prod for spot capacity. S-21 (I12509) owns the
    # final times; they stay in ET so DST needs no edit.
    schedules_et:
      data_daily: {days: MON-FRI, time_et: "23:00"}
      serve_daily_m: {days: MON-FRI, time_et: "23:30"}
      serve_daily_u: {days: MON-FRI, time_et: "23:30"}
      serve_daily_s: {days: MON-FRI, time_et: "23:45"}
      weekly: {days: SAT, time_et: "15:00"}
